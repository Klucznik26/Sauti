# CI MaktabaSauti / Sauti.  Zasada: weryfikacja wielowatkowa pod ThreadSanitizerem jest WYMAGANA i brak runtime TSan wywraca zadanie (nie jest pomijany).
# Uwaga: ten plik zostal napisany bez mozliwosci uruchomienia go lokalnie; pierwszy przebieg moze ujawnic bledy konfiguracji.  Zadania, ktorych zielonego wyniku jeszcze
# nie znamy, maja `continue-on-error: true` z komentarzem; po pierwszym zielonym przebiegu zmieniamy na wymagane.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # wymagane: dekodery AAC (ASan/UBSan w testach jednostkowych) i naglowki publiczne
  aac-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: sudo apt-get update && sudo apt-get install -y nasm gcc g++ make python3
      - name: AAC native tests
        run: make test-aac-native
      - name: "C kernels == NASM kernels (21 functions, 660k random/edge inputs, bit for bit)"
        run: make test-portable-equivalence
      - name: public headers (C99 pedantic, C++17, ABI layout)
        run: make test-maktabasauti-headers
      - name: "MaktabaSauti core (C99 pedantic check, ASan+UBSan: allocator contract, ownership, streaming, seek, errors, legacy bridge)"
        run: make test-maktabasauti-core
      - name: MaktabaSauti regression (new API == legacy API, PCM bit for bit, memory and file input)
        run: make test-maktabasauti-regression
      - name: MaktabaSauti core, portable build without the legacy bridge
        run: make test-maktabasauti-core-portable
      - name: "Probe audit (every probe on exact-size guarded buffers: all formats, truncated/corrupt headers, random data; open fuzz; ASan+UBSan, trivial-auto-var-init and plain builds)"
        run: make test-maktabasauti-probe-audit
      - name: "Hostile input callbacks (contract violations, claimed sizes, io errors at every point, extreme host calls)"
        run: make test-maktabasauti-hostile-io
      - name: "Third-party hardening regressions (stb_vorbis, minimp3)"
        run: make test-third-party-hardening
      - name: "Fuzz corpus replay (gcc + ASan/UBSan: probes, full API, AAC containers, hostile input)"
        run: make test-fuzz-replay
      - name: "AAC ADTS streaming (non-seekable input, partial reads, WOULD_BLOCK at every point, truncated/corrupt streams, bounded memory, exact seek)"
        run: make test-maktabasauti-aac-stream
      - name: "AAC-LD / AAC-ELD decoder (ASC, recorded PCM fingerprints, hand-built access units, every truncation and random bit flips with ASan/UBSan, LD window against a direct implementation)"
        run: make test-aac-er
      - name: "AAC-LC with 960-sample frames (fingerprints, every truncation and bit flips, all 13 sampling rates, DSE/FIL skipping, SBR / multichannel refusals, window geometry against the definition, PNS noise correlation)"
        run: make test-aac-lc960
      - name: "AAC Main (predictor_data parsing, predictor against a second implementation, reset groups / short windows / noise bands, fingerprints, every truncation and bit flips incl. predictor state, MP4 == ADTS == LOAS, exact seek over checkpoints, 12 sampling rates, refusals)"
        run: make test-aac-main
      - name: "AAC LTP (ltp_data parsing, forward MDCT / window weights / analysis TNS against their definitions, prediction against an independent model, fingerprints, every truncation and bit flips incl. the time buffers, MP4 == ADTS == LOAS, exact seek over checkpoints, 13 sampling rates, refusals)"
        run: make test-aac-ltp
      - name: "ER AAC LC / LTP syntax (equivalence with the plain syntax, fingerprints, LOAS == MP4, every truncation and bit flips for stereo and 5.1, refusals)"
        run: make test-aac-er-syntax
      - name: "USAC (xHE-AAC) frequency-domain core (UsacConfig, arithmetic spectral coding, noise filling, TNS, M/S, fingerprints of every channel, every truncation and bit flips, unsupported tools)"
        run: make test-usac
      - name: "USAC in MP4 through the engine (bit-exact with the direct decode, reads of any size, exact seeks over checkpoints, reset, LPD streams of an independent encoder, truncated files)"
        run: make test-usac-stream
      - name: "USAC with more than two channels (configurations 5 / 6 / 7: SCE / CPE / LFE, WAVE order, fingerprints of every channel, every truncation and bit flips, LFE rules, engine seeks over a checkpoint, unmapped configurations refused)"
        run: make test-usac-mc
      - name: "USAC AudioPreRoll (stream with pre-roll == stream without it from that unit on, bit for bit; payloads at random access points ignored; damaged payloads; engine seeks)"
        run: make test-usac-preroll
      - name: "USAC streams from an independent encoder (libxaac, synthetic signals): per-block fingerprints of the engine decode, reads of any size, seeks"
        run: make test-usac-xaac
      - name: "USAC LPD core (ACELP / TCX, ISO/IEC 23003-3): the algebraic vector quantiser on the RE8 lattice, LSF / LSP / LPC chain, random bit strings through the syntax layer and the decoder (ASan / UBSan)"
        run: make test-usac-lpd
      - name: "USAC eSBR predictive vector coding (PVC): the predictor against a second implementation of the clause (random energies / ids, both modes and smoothing lengths, history), the history rules, refusals, tables"
        run: make test-usac-pvc
      - name: "USAC eSBR harmonic transposer (HBE): set-up from the band tables, refusals, state, a sinusoid transposed to twice / three times its frequency through the real QMF analysis, tables"
        run: make test-usac-hbe
      - name: "USAC MPEG Surround 212: parameter decoder (hand-made PCM coded sets, strides, modes, framing), signal path against libxaac golden vectors, properties, tables"
        run: make test-usac-mps
      - name: "DVSM / AVR streaming (non-seekable input, partial reads, WOULD_BLOCK at every point, truncation, checkpoints, bounded memory)"
        run: make test-maktabasauti-dvs-stream
      - name: "WAV / AIFF streaming (differential vs the old adapters, header matrix, placeholder sizes, float WAV, truncation, mutations, bounded memory)"
        run: make test-maktabasauti-pcm-stream
      - name: "VOC streaming (indexed and streaming mode, 16384-part limit, unsupported blocks, truncation model, mutations, bounded memory)"
        run: make test-maktabasauti-voc-stream
      - name: "FLAC streaming (dr_flac over host callbacks: frame gating for WOULD_BLOCK, non-seekable input, header from the reader prefix, truncation vs the old adapter, mutations, bounded memory)"
        run: make test-maktabasauti-flac-stream
      - name: "MIDI seek work bound (silence skipping, budget, state kept after failure)"
        run: make test-midi-seek-bounds

  # fuzzing oparty na pokryciu kodu (libFuzzer + ASan + UBSan): sondy, pelne API z czytnikiem, kontenery AAC wymuszone po nazwie, wejscie lamiace kontrakt
  libfuzzer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: sudo apt-get update && sudo apt-get install -y nasm gcc make python3 clang
      - name: libFuzzer, 90 s per target (any crash, leak, UB or timeout fails the job)
        run: make fuzz-run FUZZ_SECONDS=90
      - name: "MemorySanitizer corpus replay (FULL registry incl. AAC/AVR/DVSM/YM: the NASM kernels are replaced by their bit-identical C ports)"
        run: make test-msan-replay
      - name: "libFuzzer + MemorySanitizer, 60 s per target (full registry)"
        run: make fuzz-run-msan FUZZ_SECONDS=60
      - name: crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: build/fuzz_artifact_*
          if-no-files-found: ignore

  # WYMAGANE: ThreadSanitizer.  Brak libtsan => REQUIRE_TSAN=1 daje FAIL.
  tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (libtsan is required)
        run: sudo apt-get update && sudo apt-get install -y nasm gcc make libtsan2
      - name: multi-thread re-entrancy under ThreadSanitizer (AAC adapters, legacy API)
        env:
          REQUIRE_TSAN: "1"
        run: scripts/test_aac_threads.sh 8 4
      - name: MaktabaSauti API, independent instances under ThreadSanitizer (own allocator per thread, shared read-only registries)
        env:
          REQUIRE_TSAN: "1"
        run: scripts/test_maktabasauti_threads.sh 8 4
      - name: MaktabaSauti cold start, first use of every codec from many threads at once (fresh processes; lazy-initialisation races)
        env:
          REQUIRE_TSAN: "1"
        run: scripts/test_maktabasauti_coldstart.sh 8 16

  asan-ubsan-threads:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nasm gcc make
      - name: multi-thread test under AddressSanitizer + UBSan (bit-identical PCM)
        run: |
          make build/test_aac_threads_asan
          build/test_aac_threads_asan 8 4 tests/data/lc.aac tests/data/he1.aac tests/data/he2.aac tests/data/he1.m4a tests/data/he1.loas tests/data/he1.adif tests/data/m51.aac
      - name: MaktabaSauti API threads under AddressSanitizer + UBSan
        run: |
          make build/test_maktabasauti_threads_asan
          build/test_maktabasauti_threads_asan 8 4 tests/data/lc.aac tests/data/he1.aac tests/data/he2.aac tests/data/he1.m4a tests/data/he1.loas tests/data/he1.adif tests/data/m51.aac

  # naglowki publiczne na wszystkich docelowych platformach (sam naglowek nie ma asm ani zaleznosci od systemu)
  headers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: C99 pedantic + C++17
        run: |
          cc  -std=c99   -pedantic -Wall -Wextra -Werror -Iinclude tests/test_maktabasauti_headers.c     -o t_c   && ./t_c
          c++ -std=c++17 -pedantic -Wall -Wextra -Werror -Iinclude tests/test_maktabasauti_headers_cpp.cpp -o t_cpp && ./t_cpp
      - name: MaktabaSauti core (portable, no legacy bridge, C99 pedantic)
        run: |
          cc -std=c99 -pedantic -Wall -Wextra -Werror -O1 -Iinclude -Isrc/maktabasauti tests/test_maktabasauti_core.c \
            src/maktabasauti/mks_alloc.c src/maktabasauti/mks_core.c src/maktabasauti/mks_decoder.c src/maktabasauti/mks_io.c src/maktabasauti/mks_pcm.c \
            src/maktabasauti/mks_reader.c src/maktabasauti/mks_registry.c src/maktabasauti/mks_nolegacy.c -lm -o t_core && ./t_core

  headers-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: C99 pedantic + C++17 (MinGW)
        run: |
          gcc -std=c99   -pedantic -Wall -Wextra -Werror -Iinclude tests/test_maktabasauti_headers.c     -o t_c.exe   && ./t_c.exe
          g++ -std=c++17 -pedantic -Wall -Wextra -Werror -Iinclude tests/test_maktabasauti_headers_cpp.cpp -o t_cpp.exe && ./t_cpp.exe
      - name: MaktabaSauti core (portable, no legacy bridge, C99 pedantic, MinGW)
        run: |
          gcc -std=c99 -pedantic -Wall -Wextra -Werror -O1 -Iinclude -Isrc/maktabasauti tests/test_maktabasauti_core.c \
            src/maktabasauti/mks_alloc.c src/maktabasauti/mks_core.c src/maktabasauti/mks_decoder.c src/maktabasauti/mks_io.c src/maktabasauti/mks_pcm.c \
            src/maktabasauti/mks_reader.c src/maktabasauti/mks_registry.c src/maktabasauti/mks_nolegacy.c -lm -o t_core.exe && ./t_core.exe

  headers-freebsd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          run: |
            cc  -std=c99   -pedantic -Wall -Wextra -Werror -Iinclude tests/test_maktabasauti_headers.c     -o t_c   && ./t_c
            c++ -std=c++17 -pedantic -Wall -Wextra -Werror -Iinclude tests/test_maktabasauti_headers_cpp.cpp -o t_cpp && ./t_cpp
            cc -std=c99 -pedantic -Wall -Wextra -Werror -O1 -Iinclude -Isrc/maktabasauti tests/test_maktabasauti_core.c \
              src/maktabasauti/mks_alloc.c src/maktabasauti/mks_core.c src/maktabasauti/mks_decoder.c src/maktabasauti/mks_io.c src/maktabasauti/mks_pcm.c \
              src/maktabasauti/mks_reader.c src/maktabasauti/mks_registry.c src/maktabasauti/mks_nolegacy.c -lm -o t_core && ./t_core

  # budowa bez NASM: jadra asemblerowe zastapione przez src/portable (bit w bit jak asembler); x86-64 sprawdza to samo co ARM64, ARM dodatkowo zachowanie FMA / kolejnosci dzialan
  portable-x86:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc make python3
      - name: "native AAC tests with C kernels instead of NASM (PORTABLE=1, no nasm installed)"
        run: make PORTABLE=1 OBJDIR=build_portable test-aac-native

  # ARM64: wymaganie NIE jest jeszcze wymuszone (dopoki zadanie nie przejdzie na zielono w kilku kolejnych przebiegach); zadanie istnieje, zeby wynik byl widoczny, nie ukryty
  portable-arm64:
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc make python3
      - name: "native AAC tests on ARM64 with the C kernels (PORTABLE=1)"
        run: make PORTABLE=1 OBJDIR=build_portable test-aac-native
